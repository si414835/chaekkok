name: 지난 날짜 되채우기 (임시)
on: workflow_dispatch
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install requests supabase
      - name: 오늘 순위 비교에 쓰는 10월 28일 되채우기
        env:
          DATA4LIBRARY_KEY: ${{ secrets.DATA4LIBRARY_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          API_DAILY_BATCH_LIMIT: '430'
        run: python collect.py --backfill 2026-10-28
      - name: 단계 다시 계산
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python compute_composite.py
