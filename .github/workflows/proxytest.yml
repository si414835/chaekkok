name: 중계 서버 점검 (수동)

# 오라클 중계 서버(D4L_PROXY)가 살아 있는지 본다. 정보나루 API는 부르지 않는다(첫 화면만 받음 → 하루 몫을 안 씀).
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 중계 서버로 정보나루 첫 화면 받기, 다른 주소는 막히는지
        env:
          D4L_PROXY: ${{ secrets.D4L_PROXY }}
        run: |
          python3 - <<'PY'
          import os, urllib.request
          p = os.environ.get("D4L_PROXY")
          if not p:
              print("D4L_PROXY 시크릿이 없음"); raise SystemExit(1)
          op = urllib.request.build_opener(urllib.request.ProxyHandler({"http": p}))
          def go(u):
              try:
                  r = op.open(u, timeout=30)
                  return r.status, r.headers.get("Server")
              except urllib.error.HTTPError as e:
                  return e.code, e.headers.get("Server")
              except Exception as e:
                  return type(e).__name__, str(e)[:120]
          print("정보나루 첫 화면(통과해야 함):", go("http://data4library.kr/"))
          print("다른 사이트(403으로 막혀야 함):", go("http://example.com/"))
          PY
