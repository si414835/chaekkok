name: 수집 깊이 점검 (임시)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install requests
      - env:
          DATA4LIBRARY_KEY: ${{ secrets.DATA4LIBRARY_KEY }}
        run: python probe_depth.py
