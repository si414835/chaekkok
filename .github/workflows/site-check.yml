name: 서점 링크 점검 (임시)
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1"
          UA2="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          I=9791140712250
          for U in \
            "https://m.yes24.com/Search?query=$I" \
            "https://m.yes24.com/search?query=$I&domain=BOOK" \
            "https://www.yes24.com/product/search?query=$I" \
            "https://www.yes24.com/Product/Search?domain=ALL&query=$I" ; do
            for A in "$UA" "$UA2"; do
            echo "== $U [${A:13:6}]"
            curl -sSL -A "$A" -H "Accept-Language: ko-KR,ko;q=0.9" -m 25 -o /tmp/p -w "final=%{url_effective} code=%{http_code} size=%{size_download}\n" "$U" || true
            grep -oE '/Product/Goods/[0-9]+|/Goods/Detail/[0-9]+' /tmp/p | sort | uniq -c | sort -rn | head -3
            grep -oE '<title>[^<]{0,80}' /tmp/p | head -1
            done
          done
          echo "== yes24 goods page title check"
          curl -sSL -A "$UA2" -m 25 https://www.yes24.com/Product/Goods/155545012 -o /tmp/g -w "code=%{http_code} size=%{size_download}\n"; grep -oE '<title>[^<]{0,80}' /tmp/g | head -1
          echo "== kyobo product"; curl -sSL -A "$UA2" -m 25 "http://www.kyobobook.co.kr/product/detailViewKor.laf?mallGb=KOR&ejkGb=KOR&barcode=$I" -o /tmp/k -w "final=%{url_effective} code=%{http_code} size=%{size_download}\n"
