name: site-check
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for p in / /trend /book/9791140712250 /sitemap.xml; do curl -s -o /dev/null -w "page $p %{http_code}\n" https://chaekkok.vercel.app$p; done
          curl -s https://chaekkok.vercel.app/sitemap.xml | grep -c "<loc>" | sed 's/^/sitemap urls /'
          curl -s -X POST "https://dksazvdyezxokcbjuqvp.supabase.co/functions/v1/library-info" -H "content-type: application/json" \
            -d '{"action":"books","isbns":["9791191891287"]}' | head -c 200; echo
          curl -s -X POST "https://dksazvdyezxokcbjuqvp.supabase.co/functions/v1/book-exist" -H "content-type: application/json" \
            -d '{"isbn13":"9791140712250","libCodes":["141026"]}' | head -c 200; echo
