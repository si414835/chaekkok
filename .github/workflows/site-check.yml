name: 도서관 함수 점검 (임시)
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          F="$SUPABASE_URL/functions/v1/library-info"
          echo "== nearby (위치: 수원역)"; time curl -sS -X POST "$F" -H 'content-type: application/json' -d '{"action":"nearby","isbn":"9791140712250","lat":37.2664,"lng":126.9997}' | python3 -c "import json,sys; d=json.load(sys.stdin); print({k:d.get(k) for k in ['region','total','sortedBy','checked','checkedAt','error']}); [print(' ', l['name'], l.get('distanceKm'), l.get('hasBook'), l.get('loanAvailable'), l.get('closedToday'), '|', l.get('closed')[:30]) for l in d.get('libs',[])[:10]]"
          echo "== nearby (지역만, 찜 도시=수원시)"; curl -sS -X POST "$F" -H 'content-type: application/json' -d '{"action":"nearby","isbn":"9791140712250","region":"31","preferCities":["수원시"]}' | python3 -c "import json,sys; d=json.load(sys.stdin); print({k:d.get(k) for k in ['region','total','sortedBy','checked']}); [print(' ', l['name'], l.get('hasBook'), l.get('loanAvailable')) for l in d.get('libs',[])[:6]]"
          for L in 141143 141025 111070; do
          echo "== library $L"; curl -sS -X POST "$F" -H 'content-type: application/json' -d "{\"action\":\"library\",\"libCode\":\"$L\"}" | python3 -c "import json,sys; d=json.load(sys.stdin); i=d.get('info',{}); print(i.get('name'), '| closedToday', i.get('closedToday'), '| hours', len(d.get('hours',[])), '| days', len(d.get('days',[])), '| new', len(d.get('newBooks',[])), '| popular', len(d.get('popular',[])), 'period', d.get('periodDays'), 'fresh', d.get('fresh'), d.get('error')); print('  top:', [p['title'][:15] for p in d.get('popular',[])[:3]], 'loans', [p.get('loans') for p in d.get('popular',[])[:3]]); print('  hours', d.get('hours')[:4])"
          done
          echo "== bad input"; curl -sS -X POST "$F" -H 'content-type: application/json' -d '{"action":"nearby","isbn":"x"}'; echo
