name: 책콕 데이터 수집

on:
  schedule:
    # 매일 한국시간 오전 7시 (UTC 22시, 하루 전날)에 실행
    - cron: '0 22 * * *'
  workflow_dispatch:
    # 이 버튼을 누르면 지금 바로 수동 실행도 가능

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 필요한 패키지 설치
        run: pip install requests supabase

      - name: 데이터 수집 실행
        env:
          DATA4LIBRARY_KEY: ${{ secrets.DATA4LIBRARY_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python collect.py
