name: 책콕 데이터 수집

on:
  schedule:
    # 정각은 GitHub 예약 실행이 몰려 몇 시간씩 늦어지거나 빠질 수 있어서(공식 문서) 정각을 피한다. 21:23 UTC = 06:23 KST
    - cron: '23 21 * * *'
  workflow_dispatch:

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v5

      - name: 파이썬 설치
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 필요한 패키지 설치
        run: pip install requests supabase pytrends pywebpush

      - name: 정보나루 데이터 수집 실행
        env:
          DATA4LIBRARY_KEY: ${{ secrets.DATA4LIBRARY_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python collect.py

      - name: 사서추천도서 수집 실행
        if: always()
        env:
          NL_API_KEY: ${{ secrets.NL_API_KEY }}
          DATA4LIBRARY_KEY: ${{ secrets.DATA4LIBRARY_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python nl_recommend_collect.py

      - name: 추가 데이터 수집 (연령성별·지역·이용분석·출간예정)
        if: always()
        env:
          DATA4LIBRARY_KEY: ${{ secrets.DATA4LIBRARY_KEY }}
          NL_API_KEY: ${{ secrets.NL_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python extra_collect.py

      - name: 유튜브 언급량 수집 실행
        if: always()
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python youtube_collect.py

      - name: 구글 트렌드 수집 실행
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python google_trends_collect.py

      - name: 복합 트렌드 스코어 계산
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python compute_composite.py

      - name: 블로그 글 초안 만들기
        if: always()
        env:
          DATA4LIBRARY_KEY: ${{ secrets.DATA4LIBRARY_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python blog_draft.py

      - name: 휴대폰 알림 보내기
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python send_alerts.py
