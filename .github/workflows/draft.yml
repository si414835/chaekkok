name: 블로그 초안 다시 만들기

# 매일 초안은 '책콕 데이터 수집'에서 만든다. 양식을 바꿨을 때 오늘 초안만 다시 만들고 싶으면 이걸 손으로 실행한다.
on:
  workflow_dispatch:

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install requests supabase
      - name: 오늘 블로그 초안 만들기
        env:
          API_DAILY_BATCH_LIMIT: '415'
          DATA4LIBRARY_KEY: ${{ secrets.DATA4LIBRARY_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python blog_draft.py
