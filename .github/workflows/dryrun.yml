name: 수집 대상 미리 보기 (수동)

# 정보나루는 부르지 않고, 오늘 이용분석·상세·함께 빌린 책 대상이 몇 권인지만 본다.
on:
  workflow_dispatch:
    inputs:
      probe_regions:
        description: 강원·전북 지역 코드 확인 (1이면 정보나루 8회 부름)
        default: '0'
      try_usage:
        description: 이용분석을 몇 권 실제로 받아 볼지 (0이면 안 받음, 동시 호출 시험용)
        default: '0'

jobs:
  peek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -q requests supabase
      - env:
          DATA4LIBRARY_KEY: ${{ secrets.DATA4LIBRARY_KEY }}
          D4L_PROXY: ${{ secrets.D4L_PROXY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python - <<'PY'
          import extra_collect as e, api_budget
          print("중계 서버:", api_budget.proxy_on(), "| 이용분석", e.USAGE_LIMIT, "상세", e.DETAIL_LIMIT, "함께빌린책", e.COLOAN_LIMIT, "예산", e.CALL_BUDGET)
          t = e.pick_usage_targets()
          print("이용분석 오늘 대상:", len(t))
          d = e.supabase.rpc("detail_targets", {"n": 1500}).execute().data or []
          print("상세 대상:", len(d), "(소개 필요", sum(1 for r in d if r["need_desc"]), ")")
          PY
      - name: 이용분석 조금 받아 보기 (동시 호출 시험)
        if: inputs.try_usage != '0'
        env:
          DATA4LIBRARY_KEY: ${{ secrets.DATA4LIBRARY_KEY }}
          D4L_PROXY: ${{ secrets.D4L_PROXY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          USAGE_LIMIT: ${{ inputs.try_usage }}
        run: time python extra_collect.py usage
      - name: 강원·전북 지역 코드 확인
        if: inputs.probe_regions == '1'
        env:
          DATA4LIBRARY_KEY: ${{ secrets.DATA4LIBRARY_KEY }}
          D4L_PROXY: ${{ secrets.D4L_PROXY }}
        run: |
          python - <<'PY'
          import os, requests
          from datetime import date, timedelta
          px = {"http": os.environ["D4L_PROXY"]}; key = os.environ["DATA4LIBRARY_KEY"]
          e = date.today() - timedelta(days=1); s = e - timedelta(days=29)
          for api, extra in [("loanItemSrchByLib", {"startDt": str(s), "endDt": str(e)}), ("loanItemSrch", {"startDt": str(s), "endDt": str(e)})]:
              for code in ["11", "21", "32", "35"]:
                  r = requests.get("http://data4library.kr/api/" + api, params={"authKey": key, "format": "json", "region": code, "pageSize": 3, **extra}, proxies=px, timeout=40).json()
                  resp = r.get("response", {})
                  docs = resp.get("docs") or []
                  print(api, code, "keys", list(resp.keys())[:8], "docs", len(docs), "first", (docs[0].get("doc", {}).get("bookname") if docs else None), "error", resp.get("error"))
          PY
