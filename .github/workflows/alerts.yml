name: 휴대폰 알림만 보내기

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: '보내지 않고 내용만 보기'
        type: boolean
        default: true

jobs:
  alerts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install supabase pywebpush
      - name: 알림 보내기
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python send_alerts.py ${{ inputs.dry_run && '--dry-run' || '' }}
